<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">互联网取数层 — 给 AI Agent 装中文优先的互联网眼睛</title>
  <desc id="desc">14 个中外平台，每平台一条「首选 → 备选 → 纯流程降级」有序后端链；只取数，不分析。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="14" fill="#0B1220"/>
  <rect x="1" y="1" width="1198" height="358" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <g id="title-block">
    <rect x="64" y="62" width="12" height="12" fill="#34D399"/>
    <text class="mono" x="86" y="74" font-size="17" letter-spacing="2" fill="#94A3B8">互联网取数 · SKILL</text>
    <text class="sans" x="64" y="152" font-size="72" font-weight="700" fill="#E5E7EB">互联网取数</text>
    <text class="sans" x="64" y="196" font-size="26" font-weight="700" fill="#60A5FA">给 AI 装上中文优先的眼睛</text>
    <text class="sans" x="64" y="238" font-size="21" fill="#E5E7EB">14 个平台后端链，取不到就诚实说。</text>
  </g>

  <line x1="700" y1="56" x2="700" y2="256" stroke="#1E293B" stroke-width="1.5"/>

  <g id="proof">
    <text class="sans" x="740" y="74" font-size="17" fill="#94A3B8">取数能力的三个数</text>
    <text class="mono" x="740" y="118" font-size="20" font-weight="700" fill="#34D399">14 个</text>
    <text class="sans" x="802" y="118" font-size="22" font-weight="700" fill="#E5E7EB">中外平台后端链</text>
    <text class="mono" x="740" y="164" font-size="20" font-weight="700" fill="#34D399">8 个</text>
    <text class="sans" x="791" y="164" font-size="22" font-weight="700" fill="#E5E7EB">中文平台一等公民</text>
    <text class="mono" x="740" y="210" font-size="20" font-weight="700" fill="#34D399">双轨</text>
    <text class="sans" x="794" y="210" font-size="22" font-weight="700" fill="#E5E7EB">工具 → 流程降级</text>
  </g>

  <line x1="64" y1="288" x2="1136" y2="288" stroke="#1E293B" stroke-width="1.5"/>
  <g id="install">
    <text class="mono" x="64" y="327" font-size="16" fill="#94A3B8">安装</text>
    <text class="mono" x="140" y="327" font-size="20" font-weight="700" fill="#60A5FA">npx skills add lhg-skills/lhg-net</text>
  </g>
</svg>
